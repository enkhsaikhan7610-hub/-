<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УРАН ХИЙЦ | Мэргэжлийн гутал</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script> (function(){ emailjs.init("nfT3fjYlvh2OVOO5W"); })(); </script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .main-img { width: 100%; border-radius: 12px; border: 1px solid #333; }
        .info { margin: 20px 0; }
        .variant-btn { width: 100%; padding: 15px; margin-bottom: 10px; background: #151515; border: 1px solid #444; color: #fff; border-radius: 8px; cursor: pointer; text-align: left; }
        .variant-btn.active { border-color: #d4af37; color: #d4af37; background: #221d0a; }
        .size-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .size-btn { padding: 10px 20px; border: 1px solid #444; background: #151515; color: #fff; cursor: pointer; border-radius: 5px; }
        .size-btn.active { border-color: #d4af37; background: #333; }
        .order-btn { width: 100%; padding: 20px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 16px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; border-radius: 8px; }
        .bank-info { background: #111; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; color:#d4af37;"><h1>УРАН ХИЙЦ</h1></div>
    <img id="main-img" class="main-img" src="image_c64eab.png">

    <div class="info">
        <h2 id="v-name">Энгийн загвар</h2>
        <p id="v-desc">Сонгодог загвар, өдөр тутмын эвтэйхэн хийц.</p>
        <h3 id="v-price" style="color:#d4af37;">Үнэ: 150,000₮</h3>
    </div>

    <h3>Загвар сонгох:</h3>
    <div id="variants"></div>

    <h3>Хэмжээ сонгох:</h3>
    <div class="size-box" id="sizes"></div>

    <button class="order-btn" onclick="document.getElementById('form').style.display='block'">ЗАХИАЛГА ӨГӨХ</button>

    <div id="form" style="display:none; margin-top:20px;">
        <div class="bank-info">
            <p>ХАС БАНК: <b>5003793719</b></p>
            <small>Гүйлгээний утга дээр утасны дугаараа бичнэ үү</small>
        </div>
        <input type="text" id="name" placeholder="Таны нэр">
        <input type="text" id="phone" placeholder="Утасны дугаар">
        <button class="order-btn" style="background:#fff; color:#000;" onclick="sendOrder()">ТӨЛБӨР ТӨЛСӨН / ИЛГЭЭХ</button>
    </div>
</div>

<script>
const data = [
    { n: "Энгийн загвар", img: "image_c64eab.png", p: "150,000₮", d: "Сонгодог загвар, өдөр тутмын эвтэйхэн хийц." },
    { n: "Толгойндоо нэмэлттэй", img: "IMG_0677.JPG", p: "180,000₮", d: "Толгойн хэсэгт нэмэлт хамгаалалттай, чамин угалзтай." },
    { n: "Ардаа цахилгаантай", img: "IMG_0278.jpg", p: "200,000₮", d: "Ардаа цахилгаантай, өмсөхөд хялбар, спорт загвар." }
];

let selected = data[0], selSize = "38";

data.forEach((item, i) => {
    let b = document.createElement('button');
    b.className = 'variant-btn'; b.innerText = item.n;
    b.onclick = () => { 
        selected = item; document.getElementById('main-img').src = item.img;
        document.getElementById('v-name').innerText = item.n;
        document.getElementById('v-price').innerText = "Үнэ: " + item.p;
        document.getElementById('v-desc').innerText = item.d;
        document.querySelectorAll('.variant-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
    };
    document.getElementById('variants').appendChild(b);
});

['38', '39', '40', '41', '42'].forEach(s => {
    let b = document.createElement('button');
    b.className = 'size-btn'; b.innerText = s;
    b.onclick = () => { selSize = s; document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active')); b.classList.add('active'); };
    document.getElementById('sizes').appendChild(b);
});

function sendOrder() {
    let n = document.getElementById('name').value, p = document.getElementById('phone').value;
    if(!n || !p) return alert("Мэдээллээ бүрэн бөглөнө үү!");
    emailjs.send('service_izdours', 'template_ix01rik', {
        from_name: n, phone: p, order_details: selected.n + " - Хэмжээ: " + selSize
    }).then(() => { alert("Захиалга амжилттай илгээгдлээ!"); location.reload(); });
}
</script>
</body>
</html>
